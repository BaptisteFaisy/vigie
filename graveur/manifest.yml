# Le graveur — manifest Forge · App 2 (connecteur Teamwork Graph)
#
# Écrit dans le graphe ce que la lecture seule (App 1) ne donne pas : les
# objectifs du registre local, leurs résultats clés, séries et résultats de
# période, mappés en WORK ITEMS externes (catalogue d'objets FERMÉ : pas de type
# goal/key-result). Règle : AGRÉGATS uniquement, jamais de donnée personnelle/RH/
# financière (§20, §22). Forme du module connecteur À VALIDER forge lint (§22).
#
# Règle : fichiers < 500 lignes.

app:
  # Identifiant réel de l'app (créée le 12/11/2026 via `forge create`,
  # Developer Space « laddition »), distinct de l'App 1.
  id: ari:cloud:ecosystem::app/f8387ff0-99e8-4959-93a8-71ebc1f51979
  name: Le graveur
  description: >-
    Teamwork Graph connector that engraves objectives, key results and period
    outcomes as aggregate external work items. Aggregates only: no personal, HR
    or financial data is ever ingested.
  runtime:
    name: nodejs22.x
    architecture: x86_64
    memoryMB: 512
  compatibility:
    jira:
      required: false

modules:
  # ------------------------------------------------- connecteur Teamwork Graph
  # Catalogue d'objets fermé (26 types) : un objectif → work item externe ;
  # les RC → champs ; les issues rattachées → relations. À VALIDER forge lint.
  externalConnector:
    - key: vigie-graveur
      remote: 'https://graph.atlassian.com'   # hôte à valider (§22)
      objects:
        - externalWorkItem
        - externalProject

  # ------------------------------------------------- pont signé avec l'App 1
  webtrigger:
    - key: graveur-ingest
      function: onIngest
      urlFormat: v2
      response:
        type: dynamic

  function:
    - key: onIngest
      handler: index.onIngest

permissions:
  scopes:
    # Écrire des agrégats dans le graphe via le connecteur (aucune donnée perso).
    - write:graph:work-item
    - write:graph:project